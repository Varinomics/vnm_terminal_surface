name: CI Windows

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]

defaults:
  run:
    shell: bash

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build-and-test:
    name: Qt Quick Terminal Surface (Windows)
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate Visual Studio 2026 and verify MSVC 14.51
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -version '[18.0,19.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw "Visual Studio 2026 with x64 C++ tools was not found."
          }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvarsall.bat'
          $probe = & cmd /d /c "call `"$vcvars`" x64 -vcvars_ver=14.51 && where cl"
          if ($LASTEXITCODE -ne 0) {
            throw "The MSVC 14.51 developer environment could not be initialized."
          }
          $compiler = @($probe | Where-Object { $_ -match '\\cl\.exe$' })
          $expected = Join-Path $installation 'VC\Tools\MSVC\14.51.'
          if ($compiler.Count -eq 0 -or
              -not $compiler[0].StartsWith($expected, [StringComparison]::OrdinalIgnoreCase)) {
            throw "The developer environment did not select the Visual Studio 2026 MSVC 14.51 compiler."
          }
          $compiler[0]
          "VNM_VCVARSALL_PATH=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.12.0'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase qtdeclarative'
          cache: 'true'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'

      - name: Configure CMake
        shell: cmd
        run: |
          call "%VNM_VCVARSALL_PATH%" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b %ERRORLEVEL%
          cmake -B build -S . ^
            -G "Visual Studio 18 2026" ^
            -A x64 ^
            -T "v145,version=14.51,host=x64" ^
            -DVNM_TERMINAL_BUILD_BENCHMARKS=OFF ^
            -DVNM_TERMINAL_ENABLE_PROFILING=OFF ^
            -DBUILD_TESTING=ON

      - name: Verify configured MSVC compiler (build)
        shell: pwsh
        run: |
          $compiler_files = @(Get-ChildItem -Path 'build/CMakeFiles' -Recurse -Filter CMakeCXXCompiler.cmake)
          if ($compiler_files.Count -eq 0) {
            throw "CMake did not record its C++ compiler."
          }
          $visual_studio = $env:VNM_VCVARSALL_PATH -replace '\\VC\\Auxiliary\\Build\\vcvarsall\.bat$', ''
          $expected = ($visual_studio + '/VC/Tools/MSVC/14.51.').Replace('\', '/')
          foreach ($file in $compiler_files) {
            $compiler = Select-String -LiteralPath $file.FullName -Pattern '^set\(CMAKE_CXX_COMPILER "([^"]+)"'
            if (-not $compiler -or
                -not $compiler.Matches[0].Groups[1].Value.Replace('\', '/').StartsWith(
                    $expected, [StringComparison]::OrdinalIgnoreCase)) {
              throw "CMake selected a compiler outside Visual Studio 2026 MSVC 14.51: $($file.FullName)"
            }
            $compiler.Line
          }

      - name: Build
        shell: cmd
        run: |
          call "%VNM_VCVARSALL_PATH%" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b %ERRORLEVEL%
          cmake --build build --config %CMAKE_BUILD_TYPE% --parallel 4

      - name: Run tests
        working-directory: build
        env:
          QT_QPA_PLATFORM: offscreen
        shell: cmd
        run: |
          call "%VNM_VCVARSALL_PATH%" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b %ERRORLEVEL%
          ctest --output-on-failure -C %CMAKE_BUILD_TYPE% -E "^vnm_terminal_compat_smoke$"

      # The package fixture builds a real LCD-only provider and a separate
      # atlas-disabled surface against it. Reuse that producer for distribution;
      # the main source-atlas build remains a development configuration.
      - name: Install package
        run: |
          cmake --install build/package_smoke/source_package/surface-build \
            --config ${CMAKE_BUILD_TYPE} --prefix "${GITHUB_WORKSPACE}/install"

      - name: Configure package smoke
        shell: cmd
        run: |
          call "%VNM_VCVARSALL_PATH%" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b %ERRORLEVEL%
          cmake -B package-smoke -S tests/package_smoke ^
            -C build/package_smoke/source_package/dependencies.cmake ^
            -G "Visual Studio 18 2026" ^
            -A x64 ^
            -T "v145,version=14.51,host=x64" ^
            -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%/install"

      - name: Verify configured MSVC compiler (package-smoke)
        shell: pwsh
        run: |
          $compiler_files = @(Get-ChildItem -Path 'package-smoke/CMakeFiles' -Recurse -Filter CMakeCXXCompiler.cmake)
          if ($compiler_files.Count -eq 0) {
            throw "CMake did not record its C++ compiler."
          }
          $visual_studio = $env:VNM_VCVARSALL_PATH -replace '\\VC\\Auxiliary\\Build\\vcvarsall\.bat$', ''
          $expected = ($visual_studio + '/VC/Tools/MSVC/14.51.').Replace('\', '/')
          foreach ($file in $compiler_files) {
            $compiler = Select-String -LiteralPath $file.FullName -Pattern '^set\(CMAKE_CXX_COMPILER "([^"]+)"'
            if (-not $compiler -or
                -not $compiler.Matches[0].Groups[1].Value.Replace('\', '/').StartsWith(
                    $expected, [StringComparison]::OrdinalIgnoreCase)) {
              throw "CMake selected a compiler outside Visual Studio 2026 MSVC 14.51: $($file.FullName)"
            }
            $compiler.Line
          }

      - name: Build package smoke
        shell: cmd
        run: |
          call "%VNM_VCVARSALL_PATH%" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b %ERRORLEVEL%
          cmake --build package-smoke --config %CMAKE_BUILD_TYPE% --parallel 4

  conpty-asan:
    name: Qt Quick Terminal Surface ConPTY ASan (Windows)
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Locate Visual Studio 2026 and verify MSVC 14.51
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -version '[18.0,19.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw "Visual Studio 2026 with x64 C++ tools was not found."
          }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvarsall.bat'
          $probe = & cmd /d /c "call `"$vcvars`" x64 -vcvars_ver=14.51 && where cl"
          if ($LASTEXITCODE -ne 0) {
            throw "The MSVC 14.51 developer environment could not be initialized."
          }
          $compiler = @($probe | Where-Object { $_ -match '\\cl\.exe$' })
          $expected = Join-Path $installation 'VC\Tools\MSVC\14.51.'
          if ($compiler.Count -eq 0 -or
              -not $compiler[0].StartsWith($expected, [StringComparison]::OrdinalIgnoreCase)) {
            throw "The developer environment did not select the Visual Studio 2026 MSVC 14.51 compiler."
          }
          $compiler[0]
          "VNM_VCVARSALL_PATH=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.12.0'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase qtdeclarative'
          cache: 'true'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'

      - name: Add MSVC AddressSanitizer runtime to PATH
        shell: pwsh
        run: |
          $vs_path = $env:VNM_VCVARSALL_PATH -replace '\\VC\\Auxiliary\\Build\\vcvarsall\.bat$', ''
          $msvc_tools_path = Join-Path $vs_path "VC\Tools\MSVC"
          $asan_runtime = Get-ChildItem -Path $msvc_tools_path `
            -Recurse `
            -Filter "clang_rt.asan_dynamic-x86_64.dll" |
            Where-Object { $_.FullName -like "*\MSVC\14.51.*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $asan_runtime) {
            throw "MSVC AddressSanitizer runtime was not found."
          }

          $asan_runtime.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        shell: cmd
        run: |
          call "%VNM_VCVARSALL_PATH%" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b %ERRORLEVEL%
          cmake -B build-asan -S . ^
            -G "Visual Studio 18 2026" ^
            -A x64 ^
            -T "v145,version=14.51,host=x64" ^
            -DVNM_TERMINAL_BUILD_BENCHMARKS=OFF ^
            -DVNM_TERMINAL_ENABLE_PROFILING=OFF ^
            -DVNM_TERMINAL_SANITIZE_ADDRESS=ON ^
            -DBUILD_TESTING=ON

      - name: Verify configured MSVC compiler (build-asan)
        shell: pwsh
        run: |
          $compiler_files = @(Get-ChildItem -Path 'build-asan/CMakeFiles' -Recurse -Filter CMakeCXXCompiler.cmake)
          if ($compiler_files.Count -eq 0) {
            throw "CMake did not record its C++ compiler."
          }
          $visual_studio = $env:VNM_VCVARSALL_PATH -replace '\\VC\\Auxiliary\\Build\\vcvarsall\.bat$', ''
          $expected = ($visual_studio + '/VC/Tools/MSVC/14.51.').Replace('\', '/')
          foreach ($file in $compiler_files) {
            $compiler = Select-String -LiteralPath $file.FullName -Pattern '^set\(CMAKE_CXX_COMPILER "([^"]+)"'
            if (-not $compiler -or
                -not $compiler.Matches[0].Groups[1].Value.Replace('\', '/').StartsWith(
                    $expected, [StringComparison]::OrdinalIgnoreCase)) {
              throw "CMake selected a compiler outside Visual Studio 2026 MSVC 14.51: $($file.FullName)"
            }
            $compiler.Line
          }

      - name: Build ConPTY backend ASan test
        shell: cmd
        run: |
          call "%VNM_VCVARSALL_PATH%" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b %ERRORLEVEL%
          cmake --build build-asan --config %CMAKE_BUILD_TYPE% --target vnm_terminal_windows_conpty_backend --parallel 4

      - name: Run ConPTY backend ASan test
        working-directory: build-asan
        env:
          QT_QPA_PLATFORM: offscreen
        shell: cmd
        run: |
          call "%VNM_VCVARSALL_PATH%" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b %ERRORLEVEL%
          ctest --output-on-failure -C %CMAKE_BUILD_TYPE% -R "^vnm_terminal_windows_conpty_backend$"
