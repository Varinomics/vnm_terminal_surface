name: CI macOS

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]
  workflow_dispatch:
    inputs:
      focused_units:
        description: 'Run only screen, Unicode width, backend session and surface host units'
        type: boolean
        default: false
      diagnose_content_tail:
        description: 'Capture a backtrace for the content-tail projection test'
        type: boolean
        default: false

defaults:
  run:
    shell: bash

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build-and-test:
    name: Qt Quick Terminal Surface (macOS, ${{ matrix.test_group }})
    runs-on: macos-15-intel
    strategy:
      # A lost native-test runner must not cancel the independent test groups.
      fail-fast: false
      matrix:
        test_group: ${{ fromJSON(inputs.diagnose_content_tail && '["content-tail"]' || inputs.focused_units && '["focused"]' || '["custody", "custody-rights", "native", "remaining"]') }}
    env:
      TEST_GROUP: ${{ matrix.test_group }}
      CCACHE_MAXSIZE: 2GiB
      CCACHE_COMPILERCHECK: content
      # Nested package builds inherit the launchers without caching their trees.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install and identify compiler cache
        id: compiler_cache
        run: |
          brew install ccache
          echo "CCACHE_DIR=${RUNNER_TEMP}/vnm-terminal-surface-ccache" >> "${GITHUB_ENV}"
          {
            ccache --version
            xcodebuild -version
            xcrun --show-sdk-path
            xcrun --show-sdk-version
            shasum -a 256 "$(xcrun --find clang++)" "$(command -v ccache)"
          } | tee "${RUNNER_TEMP}/compiler-cache-toolchain.txt"
          toolchain_hash=$(shasum -a 256 "${RUNNER_TEMP}/compiler-cache-toolchain.txt" | cut -d ' ' -f 1)
          echo "key_prefix=${RUNNER_OS}-${RUNNER_ARCH}-ccache-${CMAKE_BUILD_TYPE}-${{ hashFiles('.github/workflows/ci-macos.yml') }}-${toolchain_hash}-" >> "${GITHUB_OUTPUT}"

      - name: Restore compiler cache
        id: restore_compiler_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler_cache.outputs.key_prefix }}${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.test_group }}-build
          # Compiler content, options and inputs remain validated by ccache.
          restore-keys: |
            ${{ steps.compiler_cache.outputs.key_prefix }}
            ${{ runner.os }}-${{ runner.arch }}-ccache-${{ env.CMAKE_BUILD_TYPE }}-

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.12.0'
          arch: 'clang_64'
          archives: 'qtbase qtdeclarative'
          cache: 'true'

      - name: Configure CMake
        run: |
          ccache --zero-stats
          diagnostics=()
          if [[ "${TEST_GROUP}" == "content-tail" ]]; then
            diagnostics=(-DCMAKE_C_FLAGS=-g -DCMAKE_CXX_FLAGS=-g -DVNM_TERMINAL_SANITIZE_ADDRESS=ON)
          fi
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} \
            -DVNM_TERMINAL_BUILD_BENCHMARKS=OFF \
            -DVNM_TERMINAL_ENABLE_PROFILING=OFF \
            -DBUILD_TESTING=ON "${diagnostics[@]}"

      - name: Build
        id: build
        run: |
          targets=()
          if [[ "${TEST_GROUP}" == "content-tail" ]]; then
            targets=(--target vnm_terminal_content_tail_projection)
          elif [[ "${{ inputs.focused_units }}" == "true" ]]; then
            targets=(--target
              vnm_terminal_screen_basic
              vnm_terminal_screen_operations
              vnm_terminal_unicode_width
              vnm_terminal_backend_session
              vnm_terminal_surface_host)
          fi
          cmake --build build --config ${CMAKE_BUILD_TYPE} --parallel 2 "${targets[@]}"

      - name: Report main build compiler cache
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        run: |
          ccache --show-stats --verbose | tee "${RUNNER_TEMP}/compiler-cache-stats.txt"
          for source in build/_deps/*-src; do
            if [[ -e "${source}/.git" ]]; then
              revision=$(git -C "${source}" rev-parse HEAD)
              printf '%s %s\n' "${source}" "${revision}"
            fi
          done > "${RUNNER_TEMP}/compiler-cache-sources.txt"

      # A runner lost during tests cannot run post-job cache saves.
      - name: Save main build compiler cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore_compiler_cache.outputs.cache-primary-key }}

      - name: Upload main build cache statistics
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: macos-compiler-cache-${{ matrix.test_group }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/compiler-cache-*.txt
          if-no-files-found: error

      - name: Verify and record test groups
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path
          import subprocess

          custody = '^vnm_process_custody_(tests|truncated_rights_tests)$'
          native = '^(vnm_process_custody_|vnm_terminal_posix_|vnm_terminal_native_backend_cleanup_owner_tests$)'
          filters = {
              'custody': ['-R', '^vnm_process_custody_tests$'],
              'custody-rights': ['-R', '^vnm_process_custody_truncated_rights_tests$'],
              'native': ['-R', native, '-E', custody],
              'remaining': ['-E', native],
              'focused': ['-R', '^vnm_terminal_(screen_basic|screen_operations|unicode_width|backend_session|surface_host)$'],
              'content-tail': ['-R', '^vnm_terminal_content_tail_projection$'],
          }
          evidence = Path(os.environ['RUNNER_TEMP'])

          def inventory(group, arguments):
              result = subprocess.run(
                  ['ctest', '--test-dir', 'build', '--show-only=json-v1', *arguments],
                  check=True, capture_output=True, text=True)
              (evidence / f'ctest-inventory-{group}.json').write_text(result.stdout)
              return [test['name'] for test in json.loads(result.stdout)['tests']]

          all_tests = inventory('all', [])
          selected_group = os.environ['TEST_GROUP']
          focused = selected_group in ('focused', 'content-tail')
          groups = [selected_group] if focused else ['custody', 'custody-rights', 'native', 'remaining']
          selected_tests = []
          for group in groups:
              names = inventory(group, filters[group])
              if not names:
                  raise SystemExit(f'No tests selected for {group}')
              print(f'{group}: {len(names)} tests', flush=True)
              selected_tests.extend(names)
          # CTest includes required fixtures in its inventory, so this also
          # rejects a fixture accidentally shared across independent runners.
          if not focused and collections.Counter(selected_tests) != collections.Counter(all_tests):
              raise SystemExit('Test groups must cover every registered test exactly once')
          (evidence / 'ctest-arguments.json').write_text(json.dumps(filters[selected_group]))
          PY

      - name: Upload test inventory before execution
        uses: actions/upload-artifact@v6
        with:
          name: macos-test-inventory-${{ matrix.test_group }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ctest-inventory-*.json
            ${{ runner.temp }}/ctest-arguments.json
          if-no-files-found: error

      - name: Run tests (${{ matrix.test_group }})
        id: tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ['RUNNER_TEMP'])
          arguments = json.loads((evidence / 'ctest-arguments.json').read_text())
          os.execvp('ctest', [
              'ctest', '--test-dir', 'build', '--verbose', '--output-on-failure',
              '--parallel', '1', '--no-tests=error',
              '--output-log', str(evidence / 'ctest-output.log'),
              '--output-junit', str(evidence / 'ctest-results.xml'),
              *arguments,
          ])
          PY

      - name: Capture content-tail crash backtrace
        if: ${{ !cancelled() && matrix.test_group == 'content-tail' && steps.tests.outcome == 'failure' }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shlex
          import subprocess

          evidence = Path(os.environ['RUNNER_TEMP'])
          inventory = json.loads((evidence / 'ctest-inventory-content-tail.json').read_text())
          command = inventory['tests'][0]['command']
          if command[1:3] != ['-E', 'env']:
              raise SystemExit('Unexpected content-tail test command')
          target_environment = ' '.join(shlex.quote(value) for value in command[3:-1])
          with (evidence / 'content-tail-backtrace.log').open('w') as output:
              result = subprocess.run([
                  'xcrun', 'lldb', '--batch',
                  '-o', 'settings set target.disable-aslr false',
                  '-o', 'settings set target.env-vars ' + target_environment,
                  '-o', 'run', '-k', 'thread backtrace all', '--', command[-1],
              ], stdout=output, stderr=subprocess.STDOUT, timeout=60)
          print((evidence / 'content-tail-backtrace.log').read_text(), flush=True)
          raise SystemExit(result.returncode)
          PY

      - name: Upload test results
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: macos-test-results-${{ matrix.test_group }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ctest-output.log
            ${{ runner.temp }}/ctest-results.xml
            ${{ runner.temp }}/content-tail-backtrace.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: error

      # The package fixture builds a real LCD-only provider and a separate
      # atlas-disabled surface against it. Reuse that producer for distribution;
      # the main source-atlas build remains a development configuration.
      - name: Install package
        if: ${{ matrix.test_group == 'remaining' }}
        run: |
          cmake --install build/package_smoke/source_package/surface-build \
            --config ${CMAKE_BUILD_TYPE} --prefix "${GITHUB_WORKSPACE}/install"

      - name: Configure package smoke
        if: ${{ matrix.test_group == 'remaining' }}
        run: |
          cmake -B package-smoke -S tests/package_smoke -G Ninja \
            -C build/package_smoke/source_package/dependencies.cmake \
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/install"

      - name: Build package smoke
        if: ${{ matrix.test_group == 'remaining' }}
        run: cmake --build package-smoke --config ${CMAKE_BUILD_TYPE} --parallel 2

      - name: Report package compiler cache
        if: ${{ matrix.test_group == 'remaining' }}
        run: ccache --show-stats --verbose

      - name: Save package compiler cache
        if: ${{ matrix.test_group == 'remaining' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler_cache.outputs.key_prefix }}${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.test_group }}-package
