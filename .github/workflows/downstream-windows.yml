name: Downstream Windows

# The canonical estate builds vnm_terminal against this repository's master,
# because vnm_terminal/cmake/vnm_terminal_surface_dependency.cmake prefers a
# local sibling checkout and its network fallback tracks master. vnm_terminal's
# own CI already builds the pair in the consumer-to-provider direction (it
# checks this repository out at ref master). Nothing built the pair in the
# provider-to-consumer direction, so a surface master push could break the
# canonical pair and stay green here until someone next pushed to vnm_terminal.
#
# Advisory, not blocking. The estate convention is "push surface before app",
# so a surface commit that changes the surface API legitimately breaks
# vnm_terminal master until the matching app commit is pushed. This workflow is
# therefore kept out of the required status checks. That does not make a red
# result benign. Red means the canonical pair does not configure, build or test
# clean. The selected surface must provide the narrow embedded-surface target
# and API used by vnm_terminal; its release version is independent of the app's.
# A red result therefore means the app has not adopted a semantic API change,
# the required surface capability is absent, or the pair genuinely fails to
# configure, build, or test. Read the log to distinguish those causes. This
# workflow deliberately does not use continue-on-error: an unadopted or a
# genuinely broken pair must both fail loudly and visibly, and the advisory
# status is expressed by branch protection not requiring this workflow, not by
# swallowing the exit code.

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]

# This is the first workflow here that reaches repositories other than its own,
# so it declares least privilege explicitly, matching vnm_terminal's CI Windows.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  app-build-and-test:
    name: Qt Quick Terminal Against This Surface (Windows, advisory)
    runs-on: windows-2025-vs2026

    steps:
      # actions/checkout leaves its credential in the checkout's git config so
      # later git commands can authenticate, and removes it in a post-job step.
      # This job configures and compiles pull-request-controlled surface source
      # in between, and CMake is itself executable repository code, so the app
      # checkout's token would be readable by the very code under test. Nothing
      # in this job runs git, so none of the three checkouts needs the
      # credential to survive the step that created it.
      - name: Checkout surface
        uses: actions/checkout@v5
        with:
          path: vnm_terminal_surface
          persist-credentials: false

      - name: Checkout app
        uses: actions/checkout@v5
        with:
          repository: Varinomics/vnm_terminal
          path: vnm_terminal
          ref: master
          token: ${{ secrets.VARINOMICS_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout chrome
        uses: actions/checkout@v5
        with:
          repository: Varinomics/vnm_qml_chrome
          path: vnm_qml_chrome
          ref: master
          persist-credentials: false

      - name: Locate Visual Studio 2026 and verify MSVC 14.51
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -version '[18.0,19.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw "Visual Studio 2026 with x64 C++ tools was not found."
          }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvarsall.bat'
          $probe = & cmd /d /c "call `"$vcvars`" x64 -vcvars_ver=14.51 && where cl"
          if ($LASTEXITCODE -ne 0) {
            throw "The MSVC 14.51 developer environment could not be initialized."
          }
          $compiler = @($probe | Where-Object { $_ -match '\\cl\.exe$' })
          $expected = Join-Path $installation 'VC\Tools\MSVC\14.51.'
          if ($compiler.Count -eq 0 -or
              -not $compiler[0].StartsWith($expected, [StringComparison]::OrdinalIgnoreCase)) {
            throw "The developer environment did not select the Visual Studio 2026 MSVC 14.51 compiler."
          }
          $compiler[0]
          "VNM_VCVARSALL_PATH=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.12.0'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase qtdeclarative qtsvg'
          modules: 'qtshadertools'
          cache: 'true'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'

      - name: Configure CMake
        shell: cmd
        run: |
          call "%VNM_VCVARSALL_PATH%" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b %ERRORLEVEL%
          cmake -B vnm_terminal/build -S vnm_terminal ^
            -G "Visual Studio 18 2026" ^
            -A x64 ^
            -T "v145,version=14.51,host=x64" ^
            -DVNM_TERMINAL_SURFACE_SOURCE_DIR="%GITHUB_WORKSPACE%/vnm_terminal_surface" ^
            -DVNM_QML_CHROME_SOURCE_DIR="%GITHUB_WORKSPACE%/vnm_qml_chrome" ^
            -DVNM_TERMINAL_ENABLE_PROFILING=OFF ^
            -DBUILD_TESTING=ON

      - name: Verify configured MSVC compiler (vnm_terminal/build)
        shell: pwsh
        run: |
          $compiler_files = @(Get-ChildItem -Path 'vnm_terminal/build/CMakeFiles' -Recurse -Filter CMakeCXXCompiler.cmake)
          if ($compiler_files.Count -eq 0) {
            throw "CMake did not record its C++ compiler."
          }
          $visual_studio = $env:VNM_VCVARSALL_PATH -replace '\\VC\\Auxiliary\\Build\\vcvarsall\.bat$', ''
          $expected = ($visual_studio + '/VC/Tools/MSVC/14.51.').Replace('\', '/')
          foreach ($file in $compiler_files) {
            $compiler = Select-String -LiteralPath $file.FullName -Pattern '^set\(CMAKE_CXX_COMPILER "([^"]+)"'
            if (-not $compiler -or
                -not $compiler.Matches[0].Groups[1].Value.Replace('\', '/').StartsWith(
                    $expected, [StringComparison]::OrdinalIgnoreCase)) {
              throw "CMake selected a compiler outside Visual Studio 2026 MSVC 14.51: $($file.FullName)"
            }
            $compiler.Line
          }

      - name: Build
        shell: cmd
        run: |
          call "%VNM_VCVARSALL_PATH%" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b %ERRORLEVEL%
          cmake --build vnm_terminal/build --config %CMAKE_BUILD_TYPE% --parallel 4

      - name: Run tests
        working-directory: vnm_terminal/build
        env:
          QT_QPA_PLATFORM: offscreen
        shell: cmd
        run: |
          call "%VNM_VCVARSALL_PATH%" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b %ERRORLEVEL%
          ctest --output-on-failure -C %CMAKE_BUILD_TYPE%
