name: Downstream Windows

# The canonical estate builds vnm_terminal against this repository's master,
# because vnm_terminal/cmake/vnm_terminal_surface_dependency.cmake prefers a
# local sibling checkout and its network fallback tracks master. vnm_terminal's
# own CI already builds the pair in the consumer-to-provider direction (it
# checks this repository out at ref master). Nothing built the pair in the
# provider-to-consumer direction, so a surface master push could break the
# canonical pair and stay green here until someone next pushed to vnm_terminal.
#
# Advisory, not blocking. The estate convention is "push surface before app",
# so a surface commit that changes the surface API legitimately breaks
# vnm_terminal master until the matching app commit is pushed. This workflow is
# therefore kept out of the required status checks. That does not make a red
# result benign. Red means the canonical pair does not configure, build or test
# clean. The selected surface must provide the narrow embedded-surface target
# and API used by vnm_terminal; its release version is independent of the app's.
# A red result therefore means the app has not adopted a semantic API change,
# the required surface capability is absent, or the pair genuinely fails to
# configure, build, or test. Read the log to distinguish those causes. This
# workflow deliberately does not use continue-on-error: an unadopted or a
# genuinely broken pair must both fail loudly and visibly, and the advisory
# status is expressed by branch protection not requiring this workflow, not by
# swallowing the exit code.

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]

# This is the first workflow here that reaches repositories other than its own,
# so it declares least privilege explicitly, matching vnm_terminal's CI Windows.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CMAKE_BUILD_TYPE: Release
  CMAKE_BUILD_PARALLEL_LEVEL: '4'
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_MAXSIZE: 2GiB
  CCACHE_COMPILERCHECK: content

jobs:
  app-build-and-test:
    name: Qt Quick Terminal Against This Surface (Windows, advisory)
    runs-on: windows-2025-vs2026

    steps:
      # actions/checkout leaves its credential in the checkout's git config so
      # later git commands can authenticate, and removes it in a post-job step.
      # This job configures and compiles pull-request-controlled surface source
      # in between, and CMake is itself executable repository code, so the app
      # checkout's token would be readable by the very code under test. Builds
      # and local provenance queries do not need the checkout credential.
      - name: Checkout surface
        uses: actions/checkout@v5
        with:
          path: vnm_terminal_surface
          persist-credentials: false

      - name: Checkout app
        uses: actions/checkout@v5
        with:
          repository: Varinomics/vnm_terminal
          path: vnm_terminal
          ref: master
          token: ${{ secrets.VARINOMICS_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout chrome
        uses: actions/checkout@v5
        with:
          repository: Varinomics/vnm_qml_chrome
          path: vnm_qml_chrome
          ref: master
          persist-credentials: false

      - name: Locate Visual Studio 2026 and verify MSVC 14.51
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -version '[18.0,19.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) {
            throw "Visual Studio 2026 with x64 C++ tools was not found."
          }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvarsall.bat'
          $probe = & cmd /d /c "call `"$vcvars`" x64 -vcvars_ver=14.51 && where cl"
          if ($LASTEXITCODE -ne 0) {
            throw "The MSVC 14.51 developer environment could not be initialized."
          }
          $compiler = @($probe | Where-Object { $_ -match '\\cl\.exe$' })
          $expected = Join-Path $installation 'VC\Tools\MSVC\14.51.'
          if ($compiler.Count -eq 0 -or
              -not $compiler[0].StartsWith($expected, [StringComparison]::OrdinalIgnoreCase)) {
            throw "The developer environment did not select the Visual Studio 2026 MSVC 14.51 compiler."
          }
          $compiler[0]
          "VNM_VCVARSALL_PATH=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSVC_COMPILER_DIR=$(Split-Path -Parent $compiler[0])" >> $env:GITHUB_ENV

      - name: Install and identify compiler cache
        id: compiler_cache
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          $root = Join-Path $env:RUNNER_TEMP 'ccache'
          Invoke-WebRequest -Uri 'https://github.com/ccache/ccache/releases/download/v4.14.1/ccache-4.14.1-windows-x86_64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne
              '6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4') {
              throw 'Compiler cache archive checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $cacheExe = @(Get-ChildItem -LiteralPath $root -Filter ccache.exe -Recurse)
          if ($cacheExe.Count -ne 1) { throw 'Expected one compiler cache executable.' }
          $cacheExe = $cacheExe[0]
          $cacheExe.DirectoryName >> $env:GITHUB_PATH
          "CCACHE_DIR=$env:RUNNER_TEMP/vnm-terminal-surface-ccache" >> $env:GITHUB_ENV
          $fingerprint = Join-Path $env:RUNNER_TEMP 'compiler-cache-toolchain.txt'
          Get-FileHash -Algorithm SHA256 -LiteralPath `
              "$env:MSVC_COMPILER_DIR/cl.exe", "$env:MSVC_COMPILER_DIR/c1.dll", `
              "$env:MSVC_COMPILER_DIR/c1xx.dll", "$env:MSVC_COMPILER_DIR/c2.dll", $cacheExe.FullName |
              ForEach-Object { "$($_.Hash) $($_.Path)" } | Set-Content $fingerprint
          & $cacheExe.FullName --version | Tee-Object -FilePath $fingerprint -Append
          Get-Content -LiteralPath $fingerprint
          $hash = (Get-FileHash -LiteralPath $fingerprint -Algorithm SHA256).Hash.ToLowerInvariant()
          "key_prefix=$env:RUNNER_OS-$env:RUNNER_ARCH-surface-ccache-msvc-v145-$env:CMAKE_BUILD_TYPE-$hash-" >> $env:GITHUB_OUTPUT

      - name: Restore compiler cache
        id: restore_compiler_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler_cache.outputs.key_prefix }}${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.compiler_cache.outputs.key_prefix }}${{ github.job }}-
            ${{ steps.compiler_cache.outputs.key_prefix }}

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.12.0'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase qtdeclarative qtsvg'
          modules: 'qtshadertools'
          cache: 'true'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'

      # Hosted CMake has no FASTBuild generator; Ninja supports compiler launchers.
      - name: Configure CMake
        shell: cmd
        run: |
          call "%VNM_VCVARSALL_PATH%" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b %ERRORLEVEL%
          cmake -B vnm_terminal/build -S vnm_terminal ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=%CMAKE_BUILD_TYPE% ^
            -DCMAKE_C_COMPILER="%VCToolsInstallDir%bin/Hostx64/x64/cl.exe" ^
            -DCMAKE_CXX_COMPILER="%VCToolsInstallDir%bin/Hostx64/x64/cl.exe" ^
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW ^
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded ^
            -DVNM_TERMINAL_SURFACE_SOURCE_DIR="%GITHUB_WORKSPACE%/vnm_terminal_surface" ^
            -DVNM_QML_CHROME_SOURCE_DIR="%GITHUB_WORKSPACE%/vnm_qml_chrome" ^
            -DVNM_TERMINAL_ENABLE_PROFILING=OFF ^
            -DBUILD_TESTING=ON

      - name: Verify configured MSVC compiler (vnm_terminal/build)
        shell: pwsh
        run: |
          $compiler_files = @(Get-ChildItem -Path 'vnm_terminal/build/CMakeFiles' -Recurse -Filter CMakeCXXCompiler.cmake)
          if ($compiler_files.Count -eq 0) {
            throw "CMake did not record its C++ compiler."
          }
          $visual_studio = $env:VNM_VCVARSALL_PATH -replace '\\VC\\Auxiliary\\Build\\vcvarsall\.bat$', ''
          $expected = ($visual_studio + '/VC/Tools/MSVC/14.51.').Replace('\', '/')
          foreach ($file in $compiler_files) {
            $compiler = Select-String -LiteralPath $file.FullName -Pattern '^set\(CMAKE_CXX_COMPILER "([^"]+)"'
            if (-not $compiler -or
                -not $compiler.Matches[0].Groups[1].Value.Replace('\', '/').StartsWith(
                    $expected, [StringComparison]::OrdinalIgnoreCase)) {
              throw "CMake selected a compiler outside Visual Studio 2026 MSVC 14.51: $($file.FullName)"
            }
            $compiler.Line
          }

      - name: Build
        shell: cmd
        run: |
          call "%VNM_VCVARSALL_PATH%" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b %ERRORLEVEL%
          cmake --build vnm_terminal/build --config %CMAKE_BUILD_TYPE% --parallel 4

      - name: Run tests
        working-directory: vnm_terminal/build
        env:
          QT_QPA_PLATFORM: offscreen
        shell: cmd
        run: |
          call "%VNM_VCVARSALL_PATH%" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b %ERRORLEVEL%
          ctest --output-on-failure -C %CMAKE_BUILD_TYPE%

      - name: Stage unsigned downstream runtime
        id: stage_runtime
        shell: cmd
        run: |
          call "%VNM_VCVARSALL_PATH%" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b %ERRORLEVEL%
          cmake --install vnm_terminal/build --config %CMAKE_BUILD_TYPE% ^
            --prefix "%RUNNER_TEMP%/downstream-terminal-runtime" --component vnm_terminal_runtime
          if errorlevel 1 exit /b %ERRORLEVEL%
          windeployqt --release --no-translations --skip-plugin-types qmltooling ^
            --include-plugins qoffscreen --no-opengl-sw --no-system-d3d-compiler --no-system-dxc-compiler ^
            --qmldir vnm_terminal/packaging --dir "%RUNNER_TEMP%/downstream-terminal-runtime/bin" ^
            "%RUNNER_TEMP%/downstream-terminal-runtime/bin/vnm_terminal.exe"
          if errorlevel 1 exit /b %ERRORLEVEL%
          powershell -NoProfile -ExecutionPolicy Bypass -File vnm_terminal/tools/prune_windows_runtime.ps1 ^
            -RuntimePath "%RUNNER_TEMP%/downstream-terminal-runtime/bin"

      - name: Exercise deployed downstream runtime
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          VNM_TERMINAL_SETTINGS_NO_PERSIST: '1'
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'downstream-terminal-runtime'
          $runtime = Join-Path $root 'bin/vnm_terminal.exe'
          $surface = & git -C vnm_terminal_surface rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the surface source.' }
          $application = & git -C vnm_terminal rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the application source.' }
          @{
              surface_source = $surface
              application_source = $application
              configuration = $env:CMAKE_BUILD_TYPE
              runtime_sha256 = (Get-FileHash -LiteralPath $runtime -Algorithm SHA256).Hash
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $root 'build-provenance.json')
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($name in @('QT_PLUGIN_PATH', 'QT_QPA_PLATFORM_PLUGIN_PATH', 'QML_IMPORT_PATH', 'QML2_IMPORT_PATH')) {
              [Environment]::SetEnvironmentVariable($name, $null, 'Process')
          }
          $process = Start-Process -FilePath $runtime -WindowStyle Hidden -PassThru -ArgumentList @(
              '--timeout-ms', '15000', '--require-output', '--',
              "`"$env:ComSpec`"", '/d', '/c', 'echo downstream-runtime'
          ) -WorkingDirectory $root -RedirectStandardOutput (Join-Path $root 'smoke.stdout.log') `
              -RedirectStandardError (Join-Path $root 'smoke.stderr.log')
          if (-not $process.WaitForExit(30000)) {
              $process.Kill($true)
              $process.WaitForExit()
              throw 'The deployed downstream runtime did not finish within 30 seconds.'
          }
          if ($process.ExitCode -ne 0) {
              Get-Content -LiteralPath (Join-Path $root 'smoke.stderr.log')
              throw "The deployed downstream runtime exited with $($process.ExitCode)."
          }

      - name: Upload unsigned downstream runtime
        if: always() && steps.stage_runtime.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: downstream-terminal-runtime-windows
          path: ${{ runner.temp }}/downstream-terminal-runtime
          if-no-files-found: error

      - name: Report compiler cache usage
        if: always() && steps.restore_compiler_cache.outcome == 'success'
        run: ccache --show-stats --verbose

      - name: Save compiler cache
        if: always() && steps.restore_compiler_cache.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore_compiler_cache.outputs.cache-primary-key }}
